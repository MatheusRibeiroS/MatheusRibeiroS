name: profile-summary-cards
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/summary-cards.yml
  schedule:
    - cron: "0 3 * * *"
jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@v0.13.0
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          TIME_ZONE: America/Sao_Paulo
          THEME: algolia
